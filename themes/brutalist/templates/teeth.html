{% extends "base.html" %}

{% block title %}{{ SITENAME }} - {{ page.title|striptags }}{% endblock %}

{% block content %}
<section class="teeth-page">
    <h1 class="page_title">{{ page.title }}</h1>
    <div id="teeth-viewer" class="teeth-viewer" aria-label="3D teeth model viewer"></div>
    <p id="teeth-status" class="teeth-status">loading model...</p>
</section>

<style>
    .teeth-page {
        width: 100%;
    }

    .teeth-viewer {
        width: 100%;
        max-width: 44rem;
        aspect-ratio: 1 / 1;
        margin: 0 auto;
    }

    .teeth-status {
        margin-top: 0.75rem;
        text-align: center;
    }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { STLLoader } from "three/addons/loaders/STLLoader.js";

    const container = document.getElementById("teeth-viewer");
    const status = document.getElementById("teeth-status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("pink");

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 140);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 20;
    controls.maxDistance = 300;

    const ambient = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xffffff, 1);
    key.position.set(100, 80, 120);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-120, -80, -90);
    scene.add(fill);

    function resize() {
        const width = container.clientWidth;
        const height = container.clientHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
    }

    window.addEventListener("resize", resize);
    resize();

    const loader = new STLLoader();
    loader.load(
        "/extra/teeth.stl",
        (geometry) => {
            geometry.computeVertexNormals();
            geometry.center();

            const material = new THREE.MeshStandardMaterial({
                color: 0xefe9df,
                metalness: 0.05,
                roughness: 0.55
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            const box = new THREE.Box3().setFromObject(mesh);
            const size = box.getSize(new THREE.Vector3()).length();
            if (size > 0) {
                const scale = 80 / size;
                mesh.scale.setScalar(scale);
            }

            status.textContent = "drag to rotate, scroll to zoom";
        },
        undefined,
        () => {
            status.textContent = "model not found. add your file at content/extra/teeth.stl";
        }
    );

    function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }
    animate();
</script>
{% endblock content %}
