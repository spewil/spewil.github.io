<body>

<nav class="top-nav" aria-label="back to home">
  <a class="back-arrow" href="https://www.spewil.com/">⟵</a>

  <div class="flex-wrapper">
    <div class="content">
<section class="teeth-page">
    <h1 class="page_title">teeth</h1>
    <div id="teeth-viewer" class="teeth-viewer" aria-label="3D teeth model viewer"></div>
    <p id="teeth-status" class="teeth-status">loading model...</p>
</section>

<style>
    .teeth-page {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .teeth-page .page_title {
        width: min(100%, 28rem);
        text-align: left;
    }

    .teeth-viewer {
        width: min(100%, 28rem);
        aspect-ratio: 1 / 1;
        margin: 0;
    }

    .teeth-status {
        margin-top: 0.75rem;
        text-align: center;
    }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { STLLoader } from "three/addons/loaders/STLLoader.js";

    const container = document.getElementById("teeth-viewer");
    const status = document.getElementById("teeth-status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("pink");

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 140);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);
    renderer.domElement.style.display = "block";
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 20;
    controls.maxDistance = 300;

    const ambient = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xffffff, 1);
    key.position.set(100, 80, 120);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-120, -80, -90);
    scene.add(fill);

    function resize() {
        const width = container.clientWidth;
        const height = container.clientHeight;
        renderer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
    }

    window.addEventListener("resize", resize);
    resize();

    const loader = new STLLoader();
    loader.load(
        "/extra/teeth.stl",
        (geometry) => {
            geometry.computeVertexNormals();
            geometry.computeBoundingBox();
            const geometryCenter = geometry.boundingBox.getCenter(new THREE.Vector3());
            geometry.translate(-geometryCenter.x, -geometryCenter.y, -geometryCenter.z);

            const material = new THREE.MeshStandardMaterial({
                color: 0xefe9df,
                metalness: 0.05,
                roughness: 0.55
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            const box = new THREE.Box3().setFromObject(mesh);
            const sizeVec = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(sizeVec.x, sizeVec.y, sizeVec.z);
            if (maxDim > 0) {
                const scale = 80 / maxDim;
                mesh.scale.setScalar(scale);
            }

            // Recompute bounds after scaling and fit camera directly to the model.
            const scaledBox = new THREE.Box3().setFromObject(mesh);
            const scaledSize = scaledBox.getSize(new THREE.Vector3());
            const scaledMaxDim = Math.max(scaledSize.x, scaledSize.y, scaledSize.z);
            const fov = camera.fov * (Math.PI / 180);
            const fitDistance = (scaledMaxDim / 2) / Math.tan(fov / 2);
            camera.position.set(0, 0, fitDistance * 1.6);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            controls.update();

            status.textContent = "drag to rotate, scroll to zoom";
        },
        undefined,
        () => {
            status.textContent = "model not found. add your file at content/extra/teeth.stl";
        }
    );

    function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }
    animate();
</script>
    </div>
  </div>

</body>

</html>
